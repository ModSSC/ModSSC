name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install
        run: |
          python -m pip install --upgrade pip wheel
          pip install --prefer-binary -e ".[dev]"
          pip install ruff==0.15.0

      - name: Ruff (lint and format check)
        run: |
          ruff check . && ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install
        run: |
          python -m pip install --upgrade pip wheel setuptools
          # Install PyTorch CPU-only to save disk space
          pip install --no-cache-dir torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          # Install other dependencies
          pip install --no-cache-dir --prefer-binary -e ".[dev,full]"

      - name: Check memory
        run: |
          free -h
          df -h

      - name: Tests
        run: |
          pytest -n 4 --dist loadgroup --cov-report=xml:coverage.xml
        env:
          PYTHONHASHSEED: 0

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip wheel
          pip install build
          python -m build

      - name: Audit autonomous reproduction artifacts
        shell: bash
        run: |
          set -euo pipefail
          WHEEL="$(realpath "$(find dist -maxdepth 1 -name '*.whl' -print -quit)")"
          SDIST="$(realpath "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)")"
          export WHEEL
          python .github/scripts/audit_distribution.py --wheel "$WHEEL" --sdist "$SDIST"

          AUDIT_DIR="$(mktemp -d)"
          python -m venv "$AUDIT_DIR/venv"
          "$AUDIT_DIR/venv/bin/python" -m pip install "$WHEEL"
          mkdir "$AUDIT_DIR/empty"
          cd "$AUDIT_DIR/empty"
          env -u PYTHONPATH "$AUDIT_DIR/venv/bin/modssc-reproduce" list --json > cards.json
          env -u PYTHONPATH "$AUDIT_DIR/venv/bin/modssc-reproduce" verify --json > verify.json
          "$AUDIT_DIR/venv/bin/python" - <<'PY'
          import json

          with open("cards.json", encoding="utf-8") as stream:
              cards = json.load(stream)
          with open("verify.json", encoding="utf-8") as stream:
              reports = json.load(stream)
          assert len(cards) == 23
          assert len(reports) == 23
          assert all(report["execution_ready"] for report in reports)
          PY
          env -u PYTHONPATH "$AUDIT_DIR/venv/bin/modssc-reproduce" \
            run self_training/wine_table3 --dry-run
