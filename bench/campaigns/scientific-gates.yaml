# The three adaptive Match variants cannot execute before the shared FixMatch
# training stack has passed its own conformity review.
dependencies:
  flexmatch: [fixmatch]
  free_match: [fixmatch]
  softmatch: [fixmatch]

# Legacy name-based fields remain empty solely so schema-v1 tooling can emit a
# clear migration error.  Gate decisions never consult them in schema v2.
protected_campaign_prefixes: []
exempt_campaign_ids: []
