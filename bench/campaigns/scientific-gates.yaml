schema_version: 2
registry_id: modssc-scientific-gates-v2

# Claim scopes are scientific taxonomies, not campaign-name prefixes.  The
# historical replacement keeps Co-Training available without silently adding
# it to the original Article10 benchmark.
claim_scopes:
  article10:
    - pseudo_label
    - tri_training
    - democratic_co_learning
    - fixmatch
    - flexmatch
    - free_match
    - softmatch
    - laplace_learning
    - poisson_learning
    - grand
  historical-replacements:
    - co_training

# Algorithmic conformity below currently validates the paper profiles only.
# The standardized track remains closed until the shared Match stack has its
# own standardized-protocol review. Named canaries stay exempt from this
# track-level lock while dependency ordering remains enforced.
track_statuses:
  paper: passed
  standardized: pending

# This is an execution gate, not a progress note. A method may be changed to
# `passed` only after the equation/invariant tests and a reviewed comparison
# have succeeded. `conformity_basis` must be either
# `pinned_official_implementation` or `independent_equation_oracle`. The latter
# is allowed only under the fail-closed policy in
# docs/development/scientific-conformity-oracles.md when the primary source
# supplies no usable official implementation; its fidelity ceiling is
# paper_approx. `passed` also requires non-empty evidence, reviewed_by and an
# ISO-8601 reviewed_at value.
methods:
  pseudo_label:
    algorithmic_conformity: passed
    conformity_basis: independent_equation_oracle
    evidence:
      - docs/development/pseudo-label-lee2013-equation-oracle.md
      - docs/development/easy-wave1-v5-canary-evidence.md
      - tests/inductive/methods/test_pseudo_label_lee2013_oracle.py
      - provenance/article10/evidence/easy-wave1-v5-canaries.json
      - article10-paper-pseudo-label-mnist-canary-v1 (1/1 SUCCESS after signed retry; manifest c475ed0b5e3bae2af2d9b3d7a9f51ec517d79e943dd9ce5dfaba5ebd900db07b)
