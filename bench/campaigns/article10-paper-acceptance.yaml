        published_std: 0.0009
        margin_absolute: 0.01
    required_diagnostics:
      - {path: artifacts.method.diagnostics.optimization_steps, op: eq, value: 1048576}
      - {path: artifacts.method.diagnostics.target_steps, op: eq, value: 1048576}
      - {path: artifacts.method.diagnostics.effective_pseudo_label_weight, op: gt, value: 0}
      - {path: artifacts.method.diagnostics.mean_pseudo_label_weight, op: between, value: [0.0, 1.0]}
      - {path: artifacts.method.diagnostics.reference_stack, op: eq, value: torchssl}
      - {path: artifacts.method.diagnostics.batch_size_labeled, op: eq, value: 64}
      - {path: artifacts.method.diagnostics.batch_size_unlabeled, op: eq, value: 448}
      - {path: artifacts.method.diagnostics.checkpoint_policy.checkpoint_interval_steps, op: eq, value: 5000}
      - {path: artifacts.method.diagnostics.checkpoint_policy.evaluation_interval_steps, op: eq, value: 5000}
      - {path: artifacts.method.diagnostics.sampler_contract.mode, op: eq, value: replacement}
