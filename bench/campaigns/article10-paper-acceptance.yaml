    method_id: democratic_co_learning
    repetitions: 20
    target:
      split: test
      metric: accuracy
      transform: identity
      published_mean: 0.784
      published_std: 0.021
      margin_absolute: 0.02
    required_diagnostics:
      - {path: artifacts.method.diagnostics.converged, op: eq, value: true}
      - {path: artifacts.method.diagnostics.pseudo_labels_added_total, op: gt, value: 0}
    known_deviations: []
    critical_unknowns:
      - The paper does not publish exact learner/software versions, and the Adult production source-data fingerprints are not yet pinned.

  zhou-goldman-2004-vote-table3:
    method_id: democratic_co_learning
    repetitions: 20
    # The independently reviewed equation oracle passed, but the completed
    # Table 3 controls rejected the pinned historical-learner reconstruction.
    # Keep this separate from the numerical result and from the diagnostic
    # confidence candidates below so v1 remains explicitly paper_approx.
    protocol_conformity: failed
    target:
      split: test
      metric: accuracy
      transform: identity
      published_mean: 0.944
      published_std: 0.012
      margin_absolute: 0.02
    required_diagnostics:
      - {path: artifacts.method.diagnostics.converged, op: eq, value: true}
      - {path: artifacts.method.diagnostics.n_iter, op: lt, value: 20}
      - {path: artifacts.method.diagnostics.changed_rounds, op: present}
      - {path: artifacts.method.diagnostics.pseudo_labels_added_per_learner, op: present}
      - {path: artifacts.method.diagnostics.pseudo_labels_added_total, op: gt, value: 0}
    # Table 2 reports "exs from U labeled for": 66/40/40 are pseudo-label
    # additions from U, not final learner-set sizes. These are
    # protocol-conformity blockers, not result targets; no published
    # variability is available, so only predeclared margins are enforced.
    diagnostic_targets:
      # ModSSC n_iter counts the terminal no-change convergence pass. The
      # paper does not state whether its 2.2 "rounds" includes that pass. This
      # raw convention remains a deviation but does not reverse the failed
      # protocol-conformity decision established by the Table 3 controls.
      - id: table2-mean-iterations-including-terminal-pass
        path: artifacts.method.diagnostics.n_iter
        published_mean: 2.2
        margin_absolute: 1.0
      - id: table2-naive-bayes-unlabeled-examples-assigned
        path: artifacts.method.diagnostics.pseudo_labels_added_per_learner.0
        published_mean: 66
        margin_absolute: 10
      - id: table2-c45-unlabeled-examples-assigned
        path: artifacts.method.diagnostics.pseudo_labels_added_per_learner.1
        published_mean: 40
        margin_absolute: 5
      - id: table2-3nn-unlabeled-examples-assigned
        path: artifacts.method.diagnostics.pseudo_labels_added_per_learner.2
        published_mean: 40
        margin_absolute: 5
    # Table 3 localization controls are evaluated in a diagnostic-only
    # campaign on the same 20 locked partitions. They can establish protocol
    # conformity but can never enter the primary DCL paper aggregate.
    control_targets:
      - id: table3-naive-bayes-only
        control_mode: learner_0
        split: test
        metric: accuracy
        transform: identity
        published_mean: 0.861
        margin_absolute: 0.02
      - id: table3-c45-only
        control_mode: learner_1
        split: test
        metric: accuracy
        transform: identity
        published_mean: 0.942
        margin_absolute: 0.02
      - id: table3-3nn-only
        control_mode: learner_2
        split: test
        metric: accuracy
        transform: identity
        published_mean: 0.902
        margin_absolute: 0.02
      - id: table3-combining-only
        control_mode: combining_only
        split: test
        metric: accuracy
        transform: identity
        published_mean: 0.938
        margin_absolute: 0.02
    # Goldman & Zhou (2000) explicitly use 10-fold CV on L, while the 2004 DCL
    # paper itself only says to use L/L_i. Therefore kfold+Wald is a reasoned
    # primary reconstruction, not a verified historical fact. All four
    # internal candidates completed 20/20 test-blind diagnostics and failed
    # the Table 2 dynamics. Their historical conformity remains pending even
    # though the parent Vote protocol is failed.
    confidence_candidates:
      - id: resub-wald-v1-control
        estimator: training_accuracy
        interval: wald
        folds: 10
        role: v1_control
        protocol_conformity: pending
        test_information_used: false
      - id: 10fold-wald-primary-reconstruction
        estimator: kfold_oof
        interval: wald
        folds: 10
        role: primary_reconstruction
        protocol_conformity: pending
        test_information_used: false
      - id: 10fold-wilson-conditional
        estimator: kfold_oof
        interval: wilson
        folds: 10
        role: conditional
        protocol_conformity: pending
        test_information_used: false
      - id: 10fold-clopper-pearson-conditional
        estimator: kfold_oof
        interval: clopper_pearson
        folds: 10
        role: conditional
        protocol_conformity: pending
        test_information_used: false
    known_deviations:
      - The paper does not publish exact learner/software versions; parity of ModSSC's embedded NumPy historical learners remains to be confirmed numerically.
      - The paper does not specify the confidence-interval construction; the v1 paper profile uses a clipped normal/Wald accuracy interval, while the four registered test-blind diagnostics remain distinct reconstructions.
      - No official implementation is supplied or cited, so conformity is based on the independently reviewed equation oracle rather than official-code trajectory parity.
    critical_unknowns: []

  sohn-2020-cifar10-table2-250:
    method_id: fixmatch
    repetitions: 5
    target:
      path: artifacts.method.diagnostics.paper_metrics.historical_paper_metric.test_accuracy
