      published_std: 0.0065
      margin_absolute: 0.01
    informational_targets:
      - id: fixed-terminal-without-test-selection
        path: artifacts.method.diagnostics.paper_metrics.fixed_terminal_metric.test_accuracy
        transform: one_minus
        published_mean: 0.0507
        published_std: 0.0065
        margin_absolute: 0.01
    required_diagnostics:
      - {path: artifacts.method.diagnostics.optimization_steps, op: eq, value: 1048576}
      - {path: artifacts.method.diagnostics.target_steps, op: eq, value: 1048576}
      - {path: artifacts.method.diagnostics.accepted_pseudo_labels, op: gt, value: 0}
      - {path: artifacts.method.diagnostics.confidence_threshold, op: eq, value: 0.95}
      - {path: artifacts.method.diagnostics.reference_stack, op: eq, value: google_fixmatch}
      - {path: artifacts.method.diagnostics.batch_size_labeled, op: eq, value: 64}
      - {path: artifacts.method.diagnostics.batch_size_unlabeled, op: eq, value: 448}
      - {path: artifacts.method.diagnostics.checkpoint_policy.checkpoint_interval_steps, op: eq, value: 1024}
      - {path: artifacts.method.diagnostics.checkpoint_policy.evaluation_interval_steps, op: eq, value: 1024}
      - {path: artifacts.method.diagnostics.sampler_contract.mode, op: eq, value: shuffle_repeat}
      - {path: artifacts.method.diagnostics.sampler_contract.reference_algorithm, op: eq, value: tensorflow.data.Dataset.repeat().shuffle(buffer_size)}
      - {path: artifacts.method.diagnostics.sampler_contract.rng_backend, op: eq, value: numpy_pcg64}
      - {path: artifacts.method.diagnostics.sampler_contract.seed_policy, op: eq, value: explicit_independent_loader_seeds_from_numpy_seedsequence}
      - {path: artifacts.method.diagnostics.sampler_contract.shuffle_buffer, op: eq, value: 8192}
      - {path: artifacts.method.diagnostics.sampler_contract.historical_bitstream_claimed, op: eq, value: false}
    known_deviations: []
    documented_equivalences:
      - ModSSC reproduces the pinned TensorFlow `repeat().shuffle(8192)` fill/replace transition and repeat order. The TF1 graph and parallel-input RNG bitstream was neither published nor portable, so an authenticated local slot generator draws the same uniform distribution and permits exact continuation without claiming bitwise historical draws.
      - Augmentation primitives and their distributions match the pinned source, while authenticated independent weak/strong streams replace the non-portable TensorFlow multiprocessing draw order.
      - The five ordered folds and one-example validation prefix are authenticated deterministic reconstructions of the pinned official generators; Google did not publish the generated JSON index files.
    critical_unknowns: []

  zhang-2021-cifar10-table1-250:
    method_id: flexmatch
    repetitions: 3
