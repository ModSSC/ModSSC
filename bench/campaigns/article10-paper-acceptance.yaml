schema_version: 1
registry_id: article10-paper-acceptance-v2

# Metric values and margins use fractions: 0.01 is one percentage point.
# A result can become paper_matched only if the campaign manifest also declares
# that ceiling, the method conformity gate is passed, all repetitions and
# diagnostics succeed, there are no deviations/critical unknowns, the published
# mean lies inside the replication CI95, and the absolute margin is respected.
protocols:
  lee-2013-mnist-table2-600:
    method_id: pseudo_label
    repetitions: 10
    target:
      split: test
      metric: accuracy
      transform: one_minus
      published_mean: 0.0503
      margin_absolute: 0.01
    required_diagnostics:
      - {path: artifacts.method.diagnostics.alpha_reached_final, op: eq, value: true}
      - {path: artifacts.method.diagnostics.confidence_threshold_applied, op: eq, value: false}
      - {path: artifacts.method.diagnostics.pseudo_labels_assigned_total, op: gt, value: 0}
    known_deviations:
      - The paper does not publish weight initialization or an unambiguous final stopping rule.
      - The original ten split indices are unavailable, and the paper does not state whether the optional 20% visible-unit dropout was used for Table 2.
      - The card scales pixels by 1/255 and defines an epoch as 229 unlabeled batches while recycling labeled examples; the paper does not specify either traversal detail.
    critical_unknowns: []

  nigam-ghani2000-webkb-table2:
    method_id: co_training
    repetitions: 10
    target:
      split: test
      metric: accuracy
      transform: one_minus
      published_mean: 0.054
      margin_absolute: 0.02
    # The supervised Table 2 rows are controls produced by the same run. They
    # diagnose corpus/tokenizer parity and never select a Co-Training variant.
    secondary_targets:
      - id: table2-nb12-labeled-only-error
        split: test_nb12
        metric: accuracy
        transform: one_minus
        published_mean: 0.130
        margin_absolute: 0.02
      - id: table2-nb788-fully-supervised-error
        split: test_nb788
        metric: accuracy
        transform: one_minus
        published_mean: 0.033
        margin_absolute: 0.02
    required_diagnostics:
      - {path: artifacts.method.diagnostics.protocol, op: eq, value: nigam_ghani_2000}
      - {path: artifacts.method.diagnostics.seed, op: present}
      - {path: artifacts.method.diagnostics.p, op: eq, value: 1}
      - {path: artifacts.method.diagnostics.n, op: eq, value: 3}
      - {path: artifacts.method.diagnostics.u, op: eq, value: 75}
      - {path: artifacts.method.diagnostics.k, op: eq, value: 0}
      - {path: artifacts.method.diagnostics.negative_label, op: eq, value: 0}
      - {path: artifacts.method.diagnostics.positive_label, op: eq, value: 1}
      - {path: artifacts.method.diagnostics.initial_labeled_size, op: eq, value: 12}
      - {path: artifacts.method.diagnostics.initial_unlabeled_count, op: eq, value: 776}
      - {path: artifacts.method.diagnostics.initial_class_counts, op: eq, value: {'0': 9, '1': 3}}
      - {path: artifacts.method.diagnostics.n_iter, op: between, value: [97, 194]}
      - {path: artifacts.method.diagnostics.round_trace, op: nonempty}
      - {path: artifacts.method.diagnostics.unique_pseudo_labeled_examples, op: eq, value: 776}
      - {path: artifacts.method.diagnostics.pseudo_label_proposals_view1, op: between, value: [388, 776]}
      - {path: artifacts.method.diagnostics.pseudo_label_proposals_view2, op: between, value: [388, 776]}
      - {path: artifacts.method.diagnostics.pseudo_labels_added_to_shared_l, op: between, value: [776, 1552]}
      - {path: artifacts.method.diagnostics.pseudo_labels_received_by_view1, op: between, value: [776, 1552]}
      - {path: artifacts.method.diagnostics.pseudo_labels_received_by_view2, op: between, value: [776, 1552]}
      - {path: artifacts.method.diagnostics.final_labeled_size, op: between, value: [788, 1564]}
      - {path: artifacts.method.diagnostics.remaining_unlabeled_count, op: eq, value: 0}
      - {path: artifacts.method.diagnostics.remaining_unlabeled_indices, op: eq, value: []}
      - {path: artifacts.method.diagnostics.shared_labeled_multiset, op: eq, value: true}
      - {path: artifacts.method.diagnostics.views_select_from_same_pre_round_pool, op: eq, value: true}
      - {path: artifacts.method.diagnostics.addition_policy, op: eq, value: ordered_multiset_view1_then_view2}
      - {path: artifacts.method.diagnostics.overlap_policy, op: eq, value: ordered_multiset_view1_then_view2}
      - {path: artifacts.method.diagnostics.overlap_count, op: between, value: [0, 776]}
      - {path: artifacts.method.diagnostics.duplicate_multiset_additions, op: between, value: [0, 776]}
      - {path: artifacts.method.diagnostics.same_label_overlap_count, op: between, value: [0, 776]}
      - {path: artifacts.method.diagnostics.conflicting_overlap_count, op: between, value: [0, 776]}
      - {path: artifacts.method.diagnostics.termination, op: eq, value: unlabeled_exhausted}
      - {path: artifacts.method.diagnostics.selection_score_space, op: eq, value: posterior_probability}
      - {path: artifacts.method.diagnostics.paper_confidence, op: eq, value: posterior_probability}
      - {path: artifacts.method.diagnostics.ranking_space, op: eq, value: log_posterior_probability}
      - {path: artifacts.method.diagnostics.combination_score_space, op: eq, value: summed_log_probability}
      - {path: artifacts.method.diagnostics.probability_underflow_safe, op: eq, value: true}
      - {path: artifacts.method.diagnostics.word_likelihood_smoothing, op: eq, value: add_one}
      - {path: artifacts.method.diagnostics.class_prior_smoothing, op: eq, value: add_one}
      - {path: artifacts.method.diagnostics.dynamic_feature_selection, op: eq, value: none}
      - {path: artifacts.method.diagnostics.selection_diagnostics_scope, op: eq, value: training_and_pseudo_labels_only}
      - {path: artifacts.method.diagnostics.test_metrics_used_for_protocol_selection, op: eq, value: false}
      - {path: artifacts.method.diagnostics.supervised_controls.nb12_training_size, op: eq, value: 12}
      - {path: artifacts.method.diagnostics.supervised_controls.nb788_training_size, op: eq, value: 788}
      - {path: artifacts.method.diagnostics.supervised_controls.feature_space, op: eq, value: concatenated_namespaced_views}
      - {path: artifacts.method.diagnostics.supervised_controls.class_prior_smoothing, op: eq, value: add_one}
      - {path: artifacts.method.diagnostics.supervised_controls.test_metrics_used_for_protocol_selection, op: eq, value: false}
    known_deviations:
      - The paper does not publish the ten split identities or RNG state; confirmation campaign v2 pre-registers fresh seeds 21 through 30.
      - The historical HTML/MIME parser, tokenizer, and vocabulary are unavailable; ModSSC freezes deterministic HTML stripping and CountVectorizer word counts on the authenticated CMU archive.
      - The historical cross-view collision policy and final undersized pool are not specified; ModSSC preserves both same-pool proposal streams in view-1-then-view-2 multiset order and drains the pool without replacement.
    critical_unknowns: []

