      - {path: artifacts.method.diagnostics.selected_label_count, op: gt, value: 0}
      - {path: artifacts.method.diagnostics.reference_stack, op: eq, value: torchssl}
      - {path: artifacts.method.diagnostics.batch_size_labeled, op: eq, value: 64}
      - {path: artifacts.method.diagnostics.batch_size_unlabeled, op: eq, value: 448}
      - {path: artifacts.method.diagnostics.checkpoint_policy.checkpoint_interval_steps, op: eq, value: 5000}
      - {path: artifacts.method.diagnostics.checkpoint_policy.evaluation_interval_steps, op: eq, value: 5000}
      - {path: artifacts.method.diagnostics.sampler_contract.mode, op: eq, value: replacement}
      - {path: artifacts.method.diagnostics.sampler_contract.reference_algorithm, op: eq, value: "torch.utils.data.RandomSampler(replacement=True)"}
      - {path: artifacts.method.diagnostics.sampler_contract.rng_backend, op: eq, value: torch_cpu_generator}
      - {path: artifacts.method.diagnostics.sampler_contract.seed_policy, op: eq, value: explicit_independent_loader_seeds_from_torch_root_generator}
      - {path: artifacts.method.diagnostics.sampler_contract.historical_bitstream_claimed, op: eq, value: false}
    known_deviations: []
    documented_equivalences:
      - Index sampling uses the pinned CPU `RandomSampler(replacement=True)`/`torch.randint` algorithm exactly with serialized `torch.Generator` state. Explicit per-loader seeds replace TorchSSL's process-global implicit seed allocation, whose value depends on unrelated model and worker RNG consumption.
      - Augmentation primitives and distributions match TorchSSL, while an authenticated stateless stream replaces its multiprocessing worker draw order and permits exact continuation.
      - The three ordered pools, including labeled examples in the unlabeled loader, are authenticated deterministic reconstructions because USB did not publish its generated NPY index files.
      - TorchSSL leaves conflicting updates undefined when replacement sampling repeats an unlabeled index in one CUDA batch; ModSSC explicitly applies the last accepted occurrence in batch order before writing unique CPL indices.
    critical_unknowns: []

