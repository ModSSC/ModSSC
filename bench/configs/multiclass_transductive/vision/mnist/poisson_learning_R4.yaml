run:
  name: multiclass_vision_transductive_poisson_learning_mnist_R4
  seed: 1
  seeds:
  - 1
  - 2
  - 3
  - 4
  - 5
  output_dir: ${MODSSC_OUTPUT_DIR}/multiclass_transductive/vision/mnist/poisson_learning/R4
  log_level: detailed
  fail_fast: true
limits:
  profile: auto
dataset:
  id: mnist
  download: true
  cache_dir: ${MODSSC_DATASET_CACHE_DIR}
sampling:
  seed: 1
  plan:
    split:
      kind: holdout
      test_fraction: 0.2
      val_fraction: 0.1
      stratify: true
      shuffle: true
    labeling:
      mode: per_class
      value: 10
      strategy: balanced
      min_per_class: 1
      per_class: true
      fixed_indices: null
    imbalance:
      kind: none
    policy:
      respect_official_test: true
      use_official_graph_masks: true
      allow_override_official: false
preprocess:
  seed: 1
  fit_on: train
  cache: true
  cache_dir: ${MODSSC_PREPROCESS_CACHE_DIR}
  plan:
    output_key: features.vae
    steps:
    - id: labels.encode
    - id: vision.ensure_num_channels
      params:
        num_channels: 1
    - id: vision.resize
      params:
        height: 28
        width: 28
    - id: core.ensure_2d
    - id: core.vae
      params:
        preset: poisson_mnist
        cache_key: full-poisson-mnist-raw784
        model_seed: 1
        device: auto
        fit_scope: all
method:
  kind: transductive
  id: poisson_learning
  device:
    device: auto
    dtype: float32
  params:
    backend: numpy
    laplacian_kind: paper_normalized
    eps: 0.0
    center_sources: true
    tol: 1.0e-06
    max_iter: 2000
evaluation:
  split_for_model_selection: val
  report_splits:
  - val
  - test
  metrics:
  - accuracy
  - macro_f1
  - balanced_accuracy
graph:
  enabled: true
  seed: 1
  cache: true
  cache_dir: ${MODSSC_GRAPH_CACHE_DIR}
  spec:
    scheme: knn
    metric: euclidean
    k: 10
    symmetrize: mean
    weights:
      kind: knn_gaussian
    normalize: none
    self_loops: false
    backend: sklearn
    chunk_size: 2048
    feature_field: features.vae
