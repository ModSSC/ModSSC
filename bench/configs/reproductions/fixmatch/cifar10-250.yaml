# Reproduction card: FixMatch (RandAugment), CIFAR-10, 250 labels.
#
# Profile: paper:sohn2020-cifar10-table2-250
# Fidelity ceiling: paper_matched, awarded only by the complete acceptance run.
# Published target for the selected RandAugment row: 5.07 +/- 0.65 % test
# error (94.93 +/- 0.65 % accuracy), five published folds.
# Paper/code provenance:
#   https://arxiv.org/pdf/2001.07685
#   google-research/fixmatch@d4985a158065947dba803e626ee9a6721709c570
#   microsoft/Semi-supervised-learning@1ef4cbebcc0b368158315aeb425053858cf6c845
#   config/classic_cv/fixmatch/fixmatch_cifar10_250_0.yaml
#
# This card pins the shared ModSSC WRN-28-2/SGD/EMA stack, the native
# reconstruction of the official split algorithm, B_l/B_u=64/448, 2^20 steps and the
# original median-of-last-20-checkpoints reporting policy. The implementation
# pins the Google operation table and BatchNorm interleave contract; numerical
# conformity remains an explicit acceptance gate.
acceptance:
  protocol_id: sohn-2020-cifar10-table2-250
  method_id: fixmatch
  repetitions: 5
  fidelity_ceiling: paper_matched
  conformity:
    status: passed
    basis: pinned_official_implementation
    evidence:
    - docs/replications/protocols/fixmatch-sohn-2020.md
    review:
      reviewed_by: codex:article_protocol_source_review
      reviewed_at: '2026-08-30T00:00:00+02:00'
  target:
    path: artifacts.method.diagnostics.paper_metrics.historical_paper_metric.test_accuracy
    transform: one_minus
    published_mean: 0.0507
    published_std: 0.0065
    margin_absolute: 0.01
  informational_targets:
  - id: fixed-terminal-without-test-selection
    path: artifacts.method.diagnostics.paper_metrics.fixed_terminal_metric.test_accuracy
    transform: one_minus
    published_mean: 0.0507
    published_std: 0.0065
    margin_absolute: 0.01
  required_diagnostics:
  - path: artifacts.method.diagnostics.optimization_steps
    op: eq
    value: 1048576
  - path: artifacts.method.diagnostics.target_steps
    op: eq
    value: 1048576
  - path: artifacts.method.diagnostics.accepted_pseudo_labels
    op: gt
    value: 0
  - path: artifacts.method.diagnostics.confidence_threshold
    op: eq
    value: 0.95
  - path: artifacts.method.diagnostics.reference_stack
    op: eq
    value: google_fixmatch
  - path: artifacts.method.diagnostics.batch_size_labeled
    op: eq
    value: 64
  - path: artifacts.method.diagnostics.batch_size_unlabeled
    op: eq
    value: 448
  - path: artifacts.method.diagnostics.checkpoint_policy.checkpoint_interval_steps
    op: eq
    value: 1024
  - path: artifacts.method.diagnostics.checkpoint_policy.evaluation_interval_steps
    op: eq
    value: 1024
  - path: artifacts.method.diagnostics.sampler_contract.mode
    op: eq
    value: shuffle_repeat
  - path: artifacts.method.diagnostics.sampler_contract.reference_algorithm
    op: eq
    value: tensorflow.data.Dataset.repeat().shuffle(buffer_size)
  - path: artifacts.method.diagnostics.sampler_contract.rng_backend
    op: eq
    value: numpy_pcg64
  - path: artifacts.method.diagnostics.sampler_contract.seed_policy
    op: eq
    value: explicit_independent_loader_seeds_from_numpy_seedsequence
  - path: artifacts.method.diagnostics.sampler_contract.shuffle_buffer
    op: eq
    value: 8192
  - path: artifacts.method.diagnostics.sampler_contract.historical_bitstream_claimed
    op: eq
    value: false
  deviations: []
  equivalences:
  - ModSSC reproduces the pinned TensorFlow `repeat().shuffle(8192)` fill/replace transition and repeat
    order. The TF1 graph and parallel-input RNG bitstream was neither published nor portable, so an authenticated
    local slot generator draws the same uniform distribution and permits exact continuation without claiming
    bitwise historical draws.
  - Augmentation primitives and their distributions match the pinned source, while authenticated independent
    weak/strong streams replace the non-portable TensorFlow multiprocessing draw order.
  - The five ordered folds and one-example validation prefix are authenticated deterministic reconstructions
    of the pinned official generators; Google did not publish the generated JSON index files.
  unknowns: []
run:
  name: reproduction_fixmatch_cifar10_table2_250
  seed: 1
  seeds:
  - 1
  - 2
  - 3
  - 4
  - 5
  seeded_sections:
  - sampling
  - preprocess
  - augmentation
  output_dir: ${MODSSC_OUTPUT_DIR}/reproductions/fixmatch/cifar10-250
  log_level: detailed
  fail_fast: true
  benchmark_mode: true
  resume_policy: auto
dataset:
  id: cifar10
  download: false
  cache_dir: ${MODSSC_DATASET_CACHE_DIR}
  integrity:
    fingerprint: 46bfdd98e26ed954f611b41565bc64a3ba5b5497773f2f92a7ebeaa8ff465a58
    content_sha256: 2ab0d29a8fa44ec94f2d282630b74d31a4fc9986c706173dada6e3a52d75dcfb
sampling:
  seed: 1
  plan:
    component_seeds:
      labeling: run
    partition:
      ordering: class_balanced_stream
      shuffle: false
    split:
      kind: holdout
      test_fraction: 0.0
      val_fraction: 0.0
      val_size: 1
      stratify: false
      shuffle: false
      holdout_from: start
    labeling:
      mode: per_class
      value: 25
      strategy: balanced
      min_per_class: 25
      per_class: true
      fixed_indices: null
      selection_order: permutation
      rng_backend: legacy_random_state
      selection_scope: partition
      unlabeled_pool: includes_labeled
    imbalance:
      kind: none
    policy:
      respect_official_test: true
      use_official_graph_masks: true
      allow_override_official: false
preprocess:
  seed: 1
  fit_on: train_labeled
  cache: true
  cache_dir: ${MODSSC_PREPROCESS_CACHE_DIR}
  plan:
    output_key: features.X
    steps:
    - id: labels.encode
    - id: labels.to_torch
      params:
        device: cuda
        dtype: int64
    - id: vision.ensure_num_channels
      params:
        num_channels: 3
    - id: vision.channels_order
      params:
        order: NCHW
    - id: vision.normalize
      params:
        mean: [127.5, 127.5, 127.5]
        std: [127.5, 127.5, 127.5]
    - id: core.copy_raw
    - id: core.to_torch
      params:
        device: cuda
        dtype: float32
augmentation:
  enabled: true
  seed: 1
  mode: online
  modality: vision
  # Authenticated runtime contract. The generic steps below remain the
  # executable descriptor; paper runs use ModSSC's internal Google-compatible
  # augmentation profile and never import the upstream implementation.
  online_augmenter_id: vision.cifar_reference
  online_augmenter_params:
    profile: google_fixmatch_ra
  online_augmenter_metadata:
    source: google-research/fixmatch@d4985a158065947dba803e626ee9a6721709c570
    strong_order:
    - random_horizontal_flip
    - reflect_pad_4_random_crop
    - randaugment
    - cutout
    randaugment:
      num_ops: 2
      configured_magnitude: 10
      magnitude_sampling: integer_uniform_[1,10)
    cutout:
      size_pixels: 16
      fill: 0
  weak:
    steps:
    - id: vision.random_horizontal_flip
    - id: vision.random_crop_pad
      params:
        padding: 4
  strong:
    steps:
    - id: vision.random_horizontal_flip
    - id: vision.random_crop_pad
      params:
        padding: 4
    - id: vision.randaugment
      params:
        num_ops: 2
        magnitude: 10
        num_magnitude_bins: 31
    - id: vision.cutout
      params:
        length: 16
        n_holes: 1
        fill: 0.0
method:
  kind: inductive
  id: fixmatch
  profile: paper:sohn2020-cifar10-table2-250
  device:
    device: cuda
    dtype: float32
  params:
    lambda_u: 1.0
    p_cutoff: 0.95
    temperature: 0.5
    mu: 7
    hard_label: true
    use_cat: true
    batch_size: 64
    max_epochs: 1024
    max_steps: 1048576
    detach_target: true
    training_mode: fixed_steps
    reference_implementation: google_fixmatch
    sampler_mode: shuffle_repeat
    sampler_shuffle_buffer: 8192
    augmentation_profile: google_fixmatch_ra
    interleave_bn: true
    evaluation_interval_steps: 1024
    checkpoint_interval_steps: 1024
    reporting_policy: median_last_checkpoints
    reporting_window_checkpoints: 20
    allow_short_run: false
  model:
    classifier_id: wide_resnet_cifar
    classifier_backend: torch
    classifier_params:
      depth: 28
      widen_factor: 2
      input_layout: channels_first
      reference_implementation: google_fixmatch
      bn_momentum: 0.001
      bn_eps: 0.001
      optimizer: sgd
      lr: 0.03
      momentum: 0.9
      nesterov: true
      weight_decay: 0.0005
      decay_bias_and_norm: false
      scheduler: cosine
      max_steps: 1048576
      cosine_cycles: 0.4375
      ema_decay: 0.999
      predict_with_ema: true
    ema: true
evaluation:
  during_fit_splits:
  - test
  split_for_model_selection: val
  report_splits:
  - val
  - test
  metrics:
  - accuracy
