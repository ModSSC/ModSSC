dataset:
  id: cora
  options:
    split: public
  download: false
  cache_dir: ${MODSSC_DATASET_CACHE_DIR}
  integrity:
    fingerprint: 774b6f9406cdd219aabdea52e411cfc28931fc2007878145b472e58e469e1471
    content_sha256: 0db92e9492bbe2f32d6d70018fa205b351cb5a44c3f742b2585547e8160922a6
sampling:
  seed: 0
  plan:
    split:
      kind: holdout
      test_fraction: 0.2
      val_fraction: 0.1
      stratify: true
      shuffle: true
    labeling:
      mode: fraction
      value: 1.0
      strategy: proportional
      min_per_class: 1
      per_class: false
      fixed_indices: null
    imbalance:
      kind: none
    policy:
      respect_official_test: true
      use_official_graph_masks: true
      allow_override_official: false
preprocess:
  seed: 0
  fit_on: train_labeled
  cache: true
  cache_dir: ${MODSSC_PREPROCESS_CACHE_DIR}
  plan:
    output_key: features.X
    steps:
    - id: labels.encode
    - id: core.ensure_2d
    - id: core.row_normalize
      params:
        norm: l1
    - id: core.to_numpy
method:
  kind: transductive
  id: grand
  profile: paper:feng2020-cora-table1
  device:
    device: cuda
    dtype: float32
  params:
    training_mode: random_propagation_consistency
    hidden_dim: 32
    mlp_dropout: 0.5
    input_dropout: 0.5
    hidden_dropout: 0.5
    use_batch_norm: false
    prop_steps: 8
    dropnode: 0.5
    num_samples: 4
    temperature: 0.5
    lambda_consistency: 1.0
    consistency_rampup_epochs: 0
    lr: 0.01
    weight_decay: 0.0005
    max_epochs: 5000
    patience: 200
    add_self_loops: true
evaluation:
  split_for_model_selection: val
  report_splits:
  - val
  - test
  metrics:
  - accuracy
