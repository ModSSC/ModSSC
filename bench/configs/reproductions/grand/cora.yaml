# Reproduction card: GRAND, Cora, Table 1 of Feng et al. (NeurIPS 2020).
#
# Official reference commit: THUDM/GRAND@7a2fd6e7c3f20ca2c84b06ec1c5dc7f227dbfe2b
# Published target: 85.4 +/- 0.4 accuracy over seeds 0--99 on the fixed
# Planetoid 140/500/1000 split. This card follows the executable pinned code
# when it differs from the prose: CPU Bernoulli DropNode with unscaled training
# masks / keep-probability inference, MLPLayer's actual normal_ initialization,
# and its nested loss-checkpoint / loss-or-accuracy patience rule.
acceptance:
  protocol_id: feng-2020-cora-table1-planetoid
  method_id: grand
  repetitions: 100
  fidelity_ceiling: paper_matched
  conformity:
    status: passed
    basis: pinned_official_implementation
    evidence:
    - docs/replications/protocols/grand-feng-2020.md
    review:
      reviewed_by: codex:article_protocol_source_review
      reviewed_at: '2026-08-30T00:00:00+02:00'
  target:
    split: test
    metric: accuracy
    transform: identity
    published_mean: 0.854
    published_std: 0.004
    published_std_ddof: 0
    margin_absolute: 0.01
  required_diagnostics:
  - path: artifacts.method.diagnostics.algorithm
    op: eq
    value: grand_feng2020_protocol
  - path: artifacts.method.diagnostics.perturbation
    op: eq
    value: dropnode
  - path: artifacts.method.diagnostics.dropnode_scaling
    op: eq
    value: official_train_mask_eval_keep_probability
  - path: artifacts.method.diagnostics.dropnode_rng
    op: eq
    value: official_cpu_bernoulli
  - path: artifacts.method.diagnostics.propagation
    op: eq
    value: mixed_order_mean
  - path: artifacts.method.diagnostics.initialization
    op: eq
    value: official_mlplayer_normal
  - path: artifacts.method.diagnostics.checkpoint_policy
    op: eq
    value: official_loss_checkpoint_patience_loss_or_accuracy
  - path: artifacts.method.diagnostics.model_seed
    op: present
  - path: artifacts.method.diagnostics.epochs_completed
    op: gt
    value: 0
  - path: artifacts.method.diagnostics.best_epoch
    op: present
  deviations: []
  equivalences:
  - 'Environment note: The pinned paper used PyTorch 1.2.0 on RTX 2080 Ti; runtime hardware is recorded
    separately from this scientific protocol.'
  unknowns: []
