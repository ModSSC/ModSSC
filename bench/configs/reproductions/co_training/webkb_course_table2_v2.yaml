# Confirmation card frozen before observing its five new test partitions.
# Seeds 6--10 are disjoint from both v1 and the diagnostic. Unlike v1, the
# 263-page test sample is random rather than stratified, matching the wording
# of Blum and Mitchell. Historical tokenization and the exact 2,000-feature
# selector remain incompletely specified, so the scientific ceiling stays
# paper_approx even if the numerical target is recovered.
run:
  name: reproduction_co_training_webkb_course_table2_v2
  seed: 6
  seeds: [6, 7, 8, 9, 10]
  seeded_sections: [sampling, preprocess, views]
  output_dir: ${MODSSC_OUTPUT_DIR}/reproductions/co_training/webkb_course_table2_v2
  log_level: detailed
  fail_fast: true
  benchmark_mode: false
dataset:
  id: webkb_course_cotraining
  download: false
  cache_dir: ${MODSSC_DATASET_CACHE_DIR}
  options: {}
sampling:
  seed: 6
  plan:
    split:
      kind: holdout
      test_fraction: 0.25023786869647957
      val_fraction: 0.0
      stratify: false
      shuffle: true
    labeling:
      mode: count
      value: 12
      strategy: proportional
      min_per_class: 1
      per_class: false
      fixed_indices: null
    imbalance: {kind: none}
    policy:
      respect_official_test: true
      use_official_graph_masks: true
      allow_override_official: false
preprocess:
  seed: 6
  fit_on: train
  cache: true
  cache_dir: ${MODSSC_PREPROCESS_CACHE_DIR}
  plan:
    output_key: features.X
    steps:
    - {id: labels.encode}
    - {id: core.copy_raw}
    - {id: core.to_numpy}
views:
  seed: 6
  plan:
    views:
    - name: fulltext
      input_columns: {mode: indices, indices: [0]}
      preprocess:
        output_key: features.X
        steps:
        - {id: text.ensure_strings}
        - id: text.count_vectorizer
          params: {dense: true, strip_html: true, min_df: 1}
    - name: inlinks
      input_columns: {mode: indices, indices: [1]}
      preprocess:
        output_key: features.X
        steps:
        - {id: text.ensure_strings}
        - id: text.count_vectorizer
          params: {dense: true, strip_html: true, min_df: 1}
method:
  kind: inductive
  id: co_training
  profile: paper:blum-mitchell-1998-webkb-course-confirmation-v2
  device: {device: cpu, dtype: float32}
  params:
    classifier_id: multinomial_nb
    classifier_backend: sklearn
    classifier_params: {alpha: 1.0, fit_prior: true}
    view_keys: [fulltext, inlinks]
    protocol: fixed_pool_binary_feature_selection
    p: 1
    n: 3
    u: 75
    k: 30
    positive_label: 1
    negative_label: 0
    confidence_threshold: null
    dynamic_feature_selection: mutual_information_presence
    feature_selection_max_features: 2000
    selection_score: craven_1998_normalized_nb
evaluation:
  split_for_model_selection: null
  report_splits: [test]
  metrics: [accuracy, macro_f1]
