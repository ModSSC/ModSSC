# Minimal-dataset reproduction card: Tri-Training, Congressional Voting
# Records, J4.8 block of Table III in Zhou & Li (2005), at 80% unlabeled.
#
# Published target: initial/final error 0.076/0.055 (28.0% improvement),
# averaged over three independent L/U partitions. The paper first holds out
# about 25% as test, then redraws L/U within the remaining pool. The explicit
# split component seed below therefore keeps the 109-example test set fixed,
# while run seeds 1--3 redraw 65 labeled and 261 unlabeled examples.
#
# Scientific ceiling: paper_approx, never paper_matched. OpenML data_id=56 is
# byte-equivalent to UCI Congressional Voting Records. The executable card passes all 16
# attributes to ModSSC's internal unpruned C4.5-style tree as native {n,y}
# nominal columns and preserves '?' as missing. The exact historical classifier
# version, test indices, and RNG remain unavailable.
# Every accepted run must archive and validate its immutable split manifest.
# No validation split or test-based selection is performed. The 100-round cap
# must be non-binding.
run:
  name: reproduction_tri_training_vote_table3_j48
  seed: 1
  seeds:
  - 1
  - 2
  - 3
  seeded_sections:
  - sampling
  - preprocess
  output_dir: ${MODSSC_OUTPUT_DIR}/reproductions/tri_training/vote_table3_j48
  log_level: detailed
  fail_fast: true
  benchmark_mode: false
dataset:
  id: vote
  download: false
  cache_dir: ${MODSSC_DATASET_CACHE_DIR}
  options: {}
sampling:
  seed: 1
  plan:
    component_seeds:
      split: 2005
    split:
      kind: holdout
      test_fraction: 0.25
      val_fraction: 0.0
      stratify: true
      shuffle: true
    labeling:
      mode: fraction
      value: 0.2
      strategy: proportional
      min_per_class: 1
      per_class: false
      fixed_indices: null
    imbalance:
      kind: none
    policy:
      respect_official_test: true
      use_official_graph_masks: true
      allow_override_official: false
preprocess:
  seed: 1
  fit_on: train
  cache: true
  cache_dir: ${MODSSC_PREPROCESS_CACHE_DIR}
  plan:
    output_key: features.X
    steps:
    - id: labels.encode
    - id: core.copy_raw
    - id: core.to_numpy
method:
  kind: inductive
  id: tri_training
  profile: paper:zhou-li-2005-vote-table3-j48
  device:
    device: cpu
    dtype: float32
  params:
    training_mode: error_bound_subsample
    classifier_id: decision_tree
    classifier_backend: numpy
    classifier_params:
      min_num_obj: 2
      # TriTrain.java's executable demonstration explicitly calls
      # J48.setUnpruned(true).
      unpruned: true
      binary_splits: false
      feature_schema:
      - {type: nominal, values: [n, y]}
      - {type: nominal, values: [n, y]}
      - {type: nominal, values: [n, y]}
      - {type: nominal, values: [n, y]}
      - {type: nominal, values: [n, y]}
      - {type: nominal, values: [n, y]}
      - {type: nominal, values: [n, y]}
      - {type: nominal, values: [n, y]}
      - {type: nominal, values: [n, y]}
      - {type: nominal, values: [n, y]}
      - {type: nominal, values: [n, y]}
      - {type: nominal, values: [n, y]}
      - {type: nominal, values: [n, y]}
      - {type: nominal, values: [n, y]}
      - {type: nominal, values: [n, y]}
      - {type: nominal, values: [n, y]}
      missing_values: ["?"]
    max_iter: 100
    confidence_threshold: null
    max_new_labels: null
    bootstrap_ratio: 1.0
    retain_initial_ensemble: true
    # The authors' released TriTrain.java sums the three class-probability
    # distributions before argmax, despite Table I describing a hard vote.
    # The internal classifiers preserve that strategy-level rule.
    prediction_rule: soft_average
evaluation:
  split_for_model_selection: null
  report_splits:
  - test
  metrics:
  - accuracy
  - macro_f1
