# DIAGNOSTIC DEV CARD — NON-REPORTABLE.
# Derived from bench/configs/reproductions/fixmatch/cifar10-250.yaml.
# It preserves the dataset, split, architecture, augmentations, optimizer, and
# FixMatch equations. Only the training stop is truncated to 4,096 steps; the
# full 2^20-step training horizon is preserved. Its metrics must never be used in
# paper acceptance or scientific aggregates.
#
# Reproduction card: FixMatch (RandAugment), CIFAR-10, 250 labels.
#
# Profile: paper:sohn2020-cifar10-table2-250:diagnostic-dev
# Fidelity status: not_claimable (truncated diagnostic only).
# Published target for the selected RandAugment row: 5.07 +/- 0.65 % test
# error (94.93 +/- 0.65 % accuracy), five published folds.
# Paper/code provenance:
#   https://arxiv.org/pdf/2001.07685
#   google-research/fixmatch@d4985a158065947dba803e626ee9a6721709c570
#   microsoft/Semi-supervised-learning@1ef4cbebcc0b368158315aeb425053858cf6c845
#   config/classic_cv/fixmatch/fixmatch_cifar10_250_0.yaml
#
# This card pins the shared ModSSC WRN-28-2/SGD/EMA stack, replayable online
# N=2, M=10 RandAugment, and the median of the last 20 checkpoints used by the
# paper. As a deliberately truncated diagnostic, it is never eligible for
# paper_matched; cross-framework bit-level RNG parity is not claimed.
run:
  name: diagnostic_fixmatch_cifar10_table2_250_dev
  seed: 1
  seeds:
  - 1
  seeded_sections:
  - sampling
  - preprocess
  - augmentation
  output_dir: ${MODSSC_OUTPUT_DIR}/diagnostics/paper-canaries/fixmatch/cifar10-250-dev
  log_level: detailed
  fail_fast: true
  benchmark_mode: true
dataset:
  id: cifar10
  download: false
  cache_dir: ${MODSSC_DATASET_CACHE_DIR}
sampling:
  seed: 1
  plan:
    partition:
      ordered_indices_artifact:
        path: bench/assets/cifar10_paper_splits/fixmatch-google-cifar10-250-seeds1-5.npz
        sha256: 608bb4ea8fafb58d1d7f5bc946dc805c0657ecb4dc370e84fb021ba03040198f
        unlabeled_pool: includes_labeled
        test_ref: test
        expected_train_size: 49999
        expected_val_size: 1
        expected_test_size: 10000
        expected_labeled_size: 250
        expected_unlabeled_size: 49999
        expected_per_class: 25
    split:
      kind: holdout
      test_fraction: 0.0
      val_fraction: 0.0
      stratify: true
      shuffle: true
    labeling:
      mode: per_class
      value: 25
      strategy: balanced
      min_per_class: 25
      per_class: true
      fixed_indices: null
    imbalance:
      kind: none
    policy:
      respect_official_test: true
      use_official_graph_masks: true
      allow_override_official: false
preprocess:
  seed: 1
  fit_on: train_labeled
  cache: true
  cache_dir: ${MODSSC_PREPROCESS_CACHE_DIR}
  plan:
    output_key: features.X
    steps:
    - id: labels.encode
    - id: labels.to_torch
      params:
        device: cuda
        dtype: int64
    - id: vision.ensure_num_channels
      params:
        num_channels: 3
    - id: vision.channels_order
      params:
        order: NCHW
    - id: vision.normalize
      params:
        mean: [127.5, 127.5, 127.5]
        std: [127.5, 127.5, 127.5]
    - id: core.copy_raw
    - id: core.to_torch
      params:
        device: cuda
        dtype: float32
augmentation:
  enabled: true
  seed: 1
  mode: online
  modality: vision
  reference_implementation: google_fixmatch_ra
  reference_policy:
    source: google-research/fixmatch@d4985a158065947dba803e626ee9a6721709c570
    strong_order:
    - random_horizontal_flip
    - reflect_pad_4_random_crop
    - randaugment
    - cutout
    randaugment:
      num_ops: 2
      configured_magnitude: 10
      magnitude_sampling: integer_uniform_[1,10)
    cutout:
      size_pixels: 16
      fill: 0
  weak:
    steps:
    - id: vision.random_horizontal_flip
    - id: vision.random_crop_pad
      params:
        padding: 4
  strong:
    steps:
    - id: vision.random_horizontal_flip
    - id: vision.random_crop_pad
      params:
        padding: 4
    - id: vision.randaugment
      params:
        num_ops: 2
        magnitude: 10
        num_magnitude_bins: 31
    - id: vision.cutout
      params:
        length: 16
        n_holes: 1
        fill: 0.0
method:
  kind: inductive
  id: fixmatch
  profile: paper:sohn2020-cifar10-table2-250:diagnostic-dev
  device:
    device: cuda
    dtype: float32
  params:
    lambda_u: 1.0
    p_cutoff: 0.95
    temperature: 0.5
    mu: 7
    hard_label: true
    use_cat: true
    batch_size: 64
    max_epochs: 1024
    max_steps: 4096
    detach_target: true
    training_mode: fixed_steps
    reference_implementation: google_fixmatch
    sampler_mode: shuffle_repeat
    sampler_shuffle_buffer: 8192
    augmentation_profile: google_fixmatch_ra
    interleave_bn: true
    evaluation_interval_steps: 1024
    checkpoint_interval_steps: 1024
    reporting_policy: median_last_checkpoints
    reporting_window_checkpoints: 20
    allow_short_run: true
  model:
    classifier_id: wide_resnet_cifar
    classifier_backend: torch
    classifier_params:
      depth: 28
      widen_factor: 2
      input_layout: channels_first
      reference_implementation: google_fixmatch
      bn_momentum: 0.001
      bn_eps: 0.001
      optimizer: sgd
      lr: 0.03
      momentum: 0.9
      nesterov: true
      weight_decay: 0.0005
      decay_bias_and_norm: false
      scheduler: cosine
      max_steps: 1048576
      cosine_cycles: 0.4375
      ema_decay: 0.999
      predict_with_ema: true
    ema: true
evaluation:
  split_for_model_selection: val
  evaluation_interval_steps: 1024
  checkpoint_policy: periodic_keep_last_50
  reporting_policy: median_last_20_test_checkpoints
  reporting_window_checkpoints: 20
  report_splits:
  - val
  - test
  metrics:
  - accuracy
