# DIAGNOSTIC DEV CARD — NON-REPORTABLE.
# Derived from bench/configs/reproductions/grand/cora.yaml.
# It preserves the Planetoid data/masks and GRAND equations. Only the seed set,
# training horizon, and early-stopping patience are truncated for a short
# technical canary. Its metrics must never be used in paper acceptance or
# scientific aggregates.
#
# Reproduction card: GRAND, Cora, Table 1 of Feng et al. (NeurIPS 2020).
#
# Official reference commit: THUDM/GRAND@7a2fd6e7c3f20ca2c84b06ec1c5dc7f227dbfe2b
# Published target: 85.4 +/- 0.4 accuracy over seeds 0--99 on the fixed
# Planetoid 140/500/1000 split. This card follows the executable pinned code
# when it differs from the prose: CPU Bernoulli DropNode with unscaled training
# masks / keep-probability inference, MLPLayer's actual normal_ initialization,
# and its nested loss-checkpoint / loss-or-accuracy patience rule. See
# docs/replications/protocols/grand-feng-2020.md for the source-level differences.
run:
  name: diagnostic_grand_cora_table1_dev
  seed: 0
  seeds:
  - 0
  seeded_sections:
  - preprocess
  output_dir: ${MODSSC_OUTPUT_DIR}/diagnostics/paper-canaries/grand/cora-dev
  log_level: detailed
  fail_fast: true
  benchmark_mode: false
dataset:
  id: cora
  options:
    split: public
  download: false
  cache_dir: ${MODSSC_DATASET_CACHE_DIR}
sampling:
  seed: 0
  plan:
    split:
      kind: holdout
      test_fraction: 0.2
      val_fraction: 0.1
      stratify: true
      shuffle: true
    labeling:
      mode: fraction
      value: 1.0
      strategy: proportional
      min_per_class: 1
      per_class: false
      fixed_indices: null
    imbalance:
      kind: none
    policy:
      respect_official_test: true
      use_official_graph_masks: true
      allow_override_official: false
preprocess:
  seed: 0
  fit_on: train_labeled
  cache: true
  cache_dir: ${MODSSC_PREPROCESS_CACHE_DIR}
  plan:
    output_key: features.X
    steps:
    - id: labels.encode
    - id: core.ensure_2d
    - id: core.row_normalize
      params:
        norm: l1
    - id: core.to_numpy
method:
  kind: transductive
  id: grand
  profile: paper:feng2020-cora-table1:diagnostic-dev
  device:
    device: cuda
    dtype: float32
  params:
    training_mode: random_propagation_consistency
    hidden_dim: 32
    mlp_dropout: 0.5
    input_dropout: 0.5
    hidden_dropout: 0.5
    use_batch_norm: false
    prop_steps: 8
    dropnode: 0.5
    num_samples: 4
    temperature: 0.5
    lambda_consistency: 1.0
    consistency_rampup_epochs: 0
    lr: 0.01
    weight_decay: 0.0005
    max_epochs: 20
    patience: 10
    add_self_loops: true
evaluation:
  split_for_model_selection: val
  report_splits:
  - val
  - test
  metrics:
  - accuracy
