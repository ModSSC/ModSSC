run:
  name: best_vision_transductive_poisson_learning_cifar10_R4
  seed: 3
  seeds:
  - 3
  - 4
  - 5
  - 6
  - 7
  output_dir: ${MODSSC_OUTPUT_DIR}/R4/transductive/poisson_learning/vision/cifar10
  log_level: detailed
  fail_fast: true
limits:
  profile: auto
dataset:
  id: cifar10
  download: true
  cache_dir: ${MODSSC_DATASET_CACHE_DIR}
sampling:
  seed: 3
  plan:
    split:
      kind: holdout
      test_fraction: 0.2
      val_fraction: 0.1
      stratify: true
      shuffle: true
    labeling:
      mode: per_class
      value: 10
      strategy: balanced
      min_per_class: 1
      per_class: true
      fixed_indices: null
    imbalance:
      kind: none
    policy:
      respect_official_test: true
      use_official_graph_masks: true
      allow_override_official: false
preprocess:
  seed: 3
  fit_on: train
  cache: true
  cache_dir: ${MODSSC_PREPROCESS_CACHE_DIR}
  plan:
    output_key: features.aet
    steps:
    - id: labels.encode
    - id: vision.aet
      params:
        source: precomputed
        preset: poisson_cifar10_projective
        unit_normalize: true
method:
  kind: transductive
  id: poisson_learning
  device:
    device: auto
    dtype: float32
  params:
    backend: numpy
    laplacian_kind: paper_normalized
    eps: 0.0
    center_sources: true
    tol: 1.0e-06
    max_iter: 2000
evaluation:
  split_for_model_selection: val
  report_splits:
  - val
  - test
  metrics:
  - accuracy
  - macro_f1
graph:
  enabled: true
  seed: 3
  cache: true
  cache_dir: ${MODSSC_GRAPH_CACHE_DIR}
  spec:
    scheme: knn
    metric: euclidean
    k: 10
    symmetrize: mean
    weights:
      kind: knn_gaussian
    normalize: none
    self_loops: false
    backend: numpy
    chunk_size: 1024
    feature_field: features.aet
