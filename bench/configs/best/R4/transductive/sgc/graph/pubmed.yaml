run:
  name: best_graph_transductive_sgc_pubmed_R4
  seed: 5
  seeds:
  - 5
  - 6
  - 7
  - 8
  - 9
  output_dir: ${MODSSC_OUTPUT_DIR}/R4/transductive/sgc/graph/pubmed
  fail_fast: true
  log_level: detailed
  benchmark_mode: true
dataset:
  id: pubmed
  download: false
  cache_dir: ${MODSSC_DATASET_CACHE_DIR}
sampling:
  seed: 5
  plan:
    split:
      kind: holdout
      test_fraction: 0.2
      val_fraction: 0.1
      stratify: true
      shuffle: true
    labeling:
      mode: per_class
      value: 10
      strategy: balanced
      min_per_class: 1
      per_class: true
      fixed_indices: null
    imbalance:
      kind: none
    policy:
      respect_official_test: true
      use_official_graph_masks: true
      allow_override_official: false
preprocess:
  seed: 5
  fit_on: train_labeled
  cache: true
  cache_dir: ${MODSSC_PREPROCESS_CACHE_DIR}
  plan:
    output_key: features.X
    steps:
    - id: labels.encode
    - id: core.ensure_2d
    - id: core.row_normalize
      params:
        norm: l1
        eps: 1.0e-12
    - id: core.to_numpy
method:
  kind: transductive
  id: sgc
  device:
    device: cuda
    dtype: float32
  params:
    k: 2
    lr: 0.2
    weight_decay: 5.0e-06
    max_epochs: 100
    patience: 100
    add_self_loops: true
    weight_decay_scope: all
    selection_metric: val_loss
evaluation:
  split_for_model_selection: val
  report_splits:
  - val
  - test
  metrics:
  - accuracy
  - macro_f1
