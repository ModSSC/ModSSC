run:
  name: best_vision_transductive_appnp_mnist_R5
  seed: 3
  seeds:
  - 3
  - 4
  - 5
  - 6
  - 7
  output_dir: ${MODSSC_OUTPUT_DIR}/R5/transductive/appnp/vision/mnist
  log_level: detailed
  fail_fast: true
  benchmark_mode: true
dataset:
  id: mnist
  download: false
  cache_dir: ${MODSSC_DATASET_CACHE_DIR}
sampling:
  seed: 3
  plan:
    split:
      kind: holdout
      test_fraction: 0.2
      val_fraction: 0.1
      stratify: true
      shuffle: true
    labeling:
      mode: per_class
      value: 20
      strategy: balanced
      min_per_class: 1
      per_class: true
      fixed_indices: null
    imbalance:
      kind: none
    policy:
      respect_official_test: true
      use_official_graph_masks: true
      allow_override_official: false
preprocess:
  seed: 3
  fit_on: train
  cache: true
  cache_dir: ${MODSSC_PREPROCESS_CACHE_DIR}
  plan:
    output_key: features.vae
    steps:
    - id: labels.encode
    - id: vision.ensure_num_channels
      params:
        num_channels: 1
    - id: vision.resize
      params:
        height: 28
        width: 28
    - id: core.ensure_2d
    - id: core.vae
      params:
        preset: poisson_mnist
        cache_key: full-poisson-mnist-raw784
        model_seed: 1
        device: cuda
        fit_scope: all
method:
  kind: transductive
  id: appnp
  device:
    device: cuda
    dtype: float32
  params:
    hidden_dim: 64
    dropout: 0.5
    k: 10
    alpha: 0.1
    lr: 0.01
    weight_decay: 0.005
    max_epochs: 10000
    patience: 100
    add_self_loops: true
    bias: false
    weight_decay_scope: first_layer
    selection_metric: val_acc_then_loss_reset_any
    norm_mode: sym
    adjacency_dropout: 0.0
evaluation:
  split_for_model_selection: val
  report_splits:
  - val
  - test
  metrics:
  - accuracy
  - macro_f1
graph:
  enabled: true
  seed: 3
  cache: true
  cache_dir: ${MODSSC_GRAPH_CACHE_DIR}
  spec:
    scheme: knn
    metric: euclidean
    k: 10
    symmetrize: mean
    weights:
      kind: knn_gaussian
    normalize: none
    self_loops: false
    backend: numpy
    chunk_size: 1024
    feature_field: features.vae
