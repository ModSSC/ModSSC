run:
  name: best_vision_transductive_laplace_learning_cifar10_R1
  seed: 3
  seeds:
  - 3
  - 4
  - 5
  - 6
  - 7
  output_dir: ${MODSSC_OUTPUT_DIR}/R1/transductive/laplace_learning/vision/cifar10
  log_level: detailed
  fail_fast: true
  benchmark_mode: true
dataset:
  id: cifar10
  download: false
  cache_dir: ${MODSSC_DATASET_CACHE_DIR}
sampling:
  seed: 3
  plan:
    split:
      kind: holdout
      test_fraction: 0.2
      val_fraction: 0.1
      stratify: true
      shuffle: true
    labeling:
      mode: per_class
      value: 1
      strategy: balanced
      min_per_class: 1
      per_class: true
      fixed_indices: null
    imbalance:
      kind: none
    policy:
      respect_official_test: true
      use_official_graph_masks: true
      allow_override_official: false
preprocess:
  seed: 3
  fit_on: train
  cache: true
  cache_dir: ${MODSSC_PREPROCESS_CACHE_DIR}
  plan:
    output_key: features.aet
    steps:
    - id: labels.encode
    - id: vision.aet
      params:
        source: precomputed
        expected_features_sha256: 02b21620c0c1448f00f87679efc0bd02b9cb4072b53a01277b1f6b03d2bbaeba
        expected_labels_sha256: 0ff873d4ee7578949152fa4305c30d62ace90df32e095fcc60855dc27ba591b5
        preset: poisson_cifar10_projective
        unit_normalize: true
method:
  kind: transductive
  id: laplace_learning
  device:
    device: cuda
    dtype: float32
  params: {}
evaluation:
  split_for_model_selection: val
  report_splits:
  - val
  - test
  metrics:
  - accuracy
  - macro_f1
graph:
  enabled: true
  seed: 3
  cache: true
  cache_dir: ${MODSSC_GRAPH_CACHE_DIR}
  spec:
    scheme: knn
    metric: euclidean
    k: 10
    symmetrize: mean
    weights:
      kind: knn_gaussian
    normalize: none
    self_loops: false
    backend: numpy
    chunk_size: 1024
    feature_field: features.aet
