run:
  name: best_graph_transductive_poisson_mbo_cora_R1
  seed: 5
  seeds:
  - 5
  - 6
  - 7
  - 8
  - 9
  output_dir: ${MODSSC_OUTPUT_DIR}/R1/transductive/poisson_mbo/graph/cora
  fail_fast: true
  log_level: detailed
  benchmark_mode: true
dataset:
  id: cora
  download: false
  cache_dir: ${MODSSC_DATASET_CACHE_DIR}
sampling:
  seed: 5
  plan:
    split:
      kind: holdout
      test_fraction: 0.2
      val_fraction: 0.1
      stratify: true
      shuffle: true
    labeling:
      mode: per_class
      value: 1
      strategy: balanced
      min_per_class: 1
      per_class: true
      fixed_indices: null
    imbalance:
      kind: none
    policy:
      respect_official_test: true
      use_official_graph_masks: true
      allow_override_official: false
preprocess:
  seed: 5
  fit_on: train_labeled
  cache: true
  cache_dir: ${MODSSC_PREPROCESS_CACHE_DIR}
  plan:
    output_key: features.X
    steps:
    - id: labels.encode
    - id: core.ensure_2d
    - id: core.to_numpy
method:
  kind: transductive
  id: poisson_mbo
  device:
    device: cuda
    dtype: float32
  params:
    T: 20
    mu: 1.0
    b_strategy: 'true'
    symmetrize: true
    zero_diagonal: true
    Ns: 40
    tol: 0.001
    max_iter: 1000
    poisson_eps: 0.0
    volume_tol: 0.001
    volume_max_iter: 10000
    volume_dt: 0.1
evaluation:
  split_for_model_selection: val
  report_splits:
  - val
  - test
  metrics:
  - accuracy
  - macro_f1
