run:
  name: best_graph_transductive_appnp_cora_R3
  seed: 5
  seeds:
  - 5
  - 6
  - 7
  - 8
  - 9
  output_dir: ${MODSSC_OUTPUT_DIR}/R3/transductive/appnp/graph/cora
  fail_fast: true
  log_level: detailed
limits:
  profile: auto
dataset:
  id: cora
  download: true
  cache_dir: ${MODSSC_DATASET_CACHE_DIR}
sampling:
  seed: 5
  plan:
    split:
      kind: holdout
      test_fraction: 0.2
      val_fraction: 0.1
      stratify: true
      shuffle: true
    labeling:
      mode: per_class
      value: 10
      strategy: balanced
      min_per_class: 1
      per_class: true
      fixed_indices: null
    imbalance:
      kind: none
    policy:
      respect_official_test: true
      use_official_graph_masks: true
      allow_override_official: false
preprocess:
  seed: 5
  fit_on: train_labeled
  cache: true
  cache_dir: ${MODSSC_PREPROCESS_CACHE_DIR}
  plan:
    output_key: features.X
    steps:
    - id: labels.encode
    - id: core.ensure_2d
    - id: core.row_normalize
      params:
        norm: l1
        eps: 1.0e-12
    - id: core.to_numpy
method:
  kind: transductive
  id: appnp
  device:
    device: auto
    dtype: float32
  params:
    hidden_dim: 64
    dropout: 0.5
    k: 10
    alpha: 0.1
    lr: 0.01
    weight_decay: 0.005
    max_epochs: 10000
    patience: 100
    add_self_loops: true
    norm_mode: sym
    adjacency_dropout: 0.5
    weight_decay_scope: first_layer
    selection_metric: val_acc_then_loss_reset_any
    bias: false
evaluation:
  split_for_model_selection: val
  report_splits:
  - val
  - test
  metrics:
  - accuracy
  - macro_f1
