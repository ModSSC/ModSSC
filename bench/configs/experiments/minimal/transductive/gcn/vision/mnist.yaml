run:
  name: smoke_vision_transductive_gcn_mnist
  seed: 3
  output_dir: runs/transductive/gcn/vision/mnist
  log_level: detailed
  fail_fast: true
limits:
  profile: auto
dataset:
  id: mnist
  download: true
  options:
    max_train_samples: 500
    max_test_samples: 200
    seed: 0
sampling:
  seed: 3
  plan:
    split:
      kind: holdout
      test_fraction: 0.2
      val_fraction: 0.1
      stratify: true
      shuffle: true
    labeling:
      mode: fraction
      value: 0.2
      strategy: balanced
      min_per_class: 1
    imbalance:
      kind: none
    policy:
      respect_official_test: true
      use_official_graph_masks: true
      allow_override_official: false
preprocess:
  seed: 3
  fit_on: train
  cache: true
  plan:
    output_key: features.vae
    steps:
    - id: labels.encode
    - id: vision.ensure_num_channels
      params:
        num_channels: 1
    - id: vision.resize
      params:
        height: 28
        width: 28
    - id: core.ensure_2d
    - id: core.vae
      params:
        preset: poisson_mnist
        cache_key: full-poisson-mnist-raw784
        model_seed: 1
        device: auto
        fit_scope: all
method:
  kind: transductive
  id: gcn
  device:
    device: auto
    dtype: float32
  params:
    hidden_dim: 16
    dropout: 0.5
    lr: 0.01
    weight_decay: 0.0005
    max_epochs: 2
    patience: 50
    add_self_loops: true
evaluation:
  split_for_model_selection: val
  report_splits:
  - val
  - test
  metrics:
  - accuracy
  - macro_f1
graph:
  enabled: true
  seed: 3
  cache: true
  spec:
    scheme: knn
    metric: euclidean
    k: 10
    symmetrize: mean
    weights:
      kind: knn_gaussian
    normalize: none
    self_loops: false
    backend: numpy
    chunk_size: 1024
    feature_field: features.vae
